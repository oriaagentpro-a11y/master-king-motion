<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Master King Motion · film</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #000; }
  #stage { position: relative; overflow: hidden; }
  .mk-scene * { box-sizing: border-box; }
  /* Fonts: declared in plan.json → brand.fonts (loaded by MK.film through FontFace), never system fonts. */
  .t { position: absolute; left: 0; top: 0; margin: 0; white-space: nowrap; line-height: 1; font-family: 'Brand', sans-serif; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="{{ENGINE}}/node_modules/gsap/dist/gsap.min.js"></script>
<script src="{{ENGINE}}/node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="{{ENGINE}}/rm.js"></script>
<script src="analysis/motion_dna.js"></script>
<script src="timing.js"></script>
<script src="{{ENGINE}}/mkm.js"></script>
<script>
gsap.registerPlugin(CustomEase);
// ─────────────────────────────────────────────────────────────────────────────
// One RECIPE per reference scene, in REFERENCE-LOCAL seconds (0 = start of the reference scene).
// Every time / ease / duration / position comes from the DNA (ctx.motions, ctx.play, ctx.replay, ctx.dna,
// ctx.dna.phases, rhythm) — never typed by hand. The content comes from ctx.slots (plan.json), the colours
// from ctx.colors (brand colours mapped on the reference's roles: background / accent / text).
// The recipe is a PLAIN function (not async) returning { tl } — a paused GSAP timeline — and optionally
// frame(tn, tr) for constant-rate moves (rotation, drift) that must keep their speed in NEW time tn.
// MK.film plays each plan scene on the new timeline.
// ─────────────────────────────────────────────────────────────────────────────
const RECIPES = {
  // S01: (ctx) => {
  //   const { root, colors, slots, W, H } = ctx;
  //   root.style.background = colors.background;
  //   const title = document.createElement('h1'); title.className = 't'; title.textContent = slots.titre.value;
  //   title.style.color = colors.text; title.style.fontWeight = 800; root.appendChild(title);
  //   MK.fitText(title, { w: 0.62 * W, size: 0.105 * H });          // reference box (normalised) x stage
  //   MK.place(title, 0.5, 0.17);                                  // rest centre measured on the reference
  //   const tl = gsap.timeline({ paused: true });
  //   ctx.replay(tl, title, 'title');                              // every measured move of the reference title
  //   return { tl };
  // },
};

MK.film({
  scenes: RECIPES,
  // grain / vignette / blur: only if the reference has them (dissect.json → finish), with ITS values
  // grain: { sigma: 2.0, opacity: 0.07, animated: true },
  // vignette: 0.3,
  // blur: [{ from: 3.2, to: 3.6, samples: 8, shutter: 0.5 }],
});
</script>
</body>
</html>
